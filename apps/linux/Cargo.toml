[package]
name = "zettaterm-gtk"
description = "ZettaTerm の Linux 版（GTK4）"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT OR Apache-2.0"

# GTK4 の開発ライブラリが要るので、ルートのワークスペースには入れない
[workspace]

[[bin]]
name = "zettaterm"
path = "src/main.rs"

[dependencies]
async-channel = "2"
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
pangocairo = "0.21"
zetta-core = { path = "../../crates/core" }
zetta-net = { path = "../../crates/net" }
zetta-serial = { path = "../../crates/serial" }
zetta-ttl = { path = "../../crates/ttl" }
zetta-xfer = { path = "../../crates/xfer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[lints.clippy]
all = { level = "warn", priority = -1 }

# ワークスペースと同じ、変更を当てた alacritty_terminal（vendor/alacritty_terminal/PATCHES.md）
[patch.crates-io]
alacritty_terminal = { path = "../../vendor/alacritty_terminal" }
russh = { path = "../../vendor/russh" }
