[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/vt",
    "crates/serial",
    "crates/net",
    "crates/xfer",
    "crates/ttl",
    "crates/ffi",
    "crates/cli",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
zetta-core = { path = "crates/core" }
zetta-vt = { path = "crates/vt" }
zetta-serial = { path = "crates/serial" }
zetta-net = { path = "crates/net" }
zetta-xfer = { path = "crates/xfer" }
zetta-ttl = { path = "crates/ttl" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# 曖昧な幅の文字を 2 セルにする変更を当てた alacritty_terminal（vendor/alacritty_terminal/PATCHES.md）
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
russh = { path = "vendor/russh" }
