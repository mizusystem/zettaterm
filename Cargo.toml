[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/vt",
    "crates/serial",
    "crates/net",
    "crates/xfer",
    "crates/ttl",
    "crates/ffi",
    "crates/cli",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
# license: 未決（MIT/Apache-2.0 デュアルか BSD-3-Clause）。docs/design.md の未決事項を参照。

[workspace.dependencies]
mt-core = { path = "crates/core" }
mt-vt = { path = "crates/vt" }
mt-serial = { path = "crates/serial" }
mt-net = { path = "crates/net" }
mt-xfer = { path = "crates/xfer" }
mt-ttl = { path = "crates/ttl" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
