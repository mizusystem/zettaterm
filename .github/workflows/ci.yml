name: CI

# macOS はランナーが混みやすいので、この Mac で scripts/ci-macos.sh を回す。
# GitHub 上で回したいときは macos.yml を手動実行する。

on:
  push:
    branches: [main]
  pull_request:
  # push で起動しなかったときなどに、gh workflow run CI で手動起動する
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libudev (Linux, for serialport)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace


  # Linux 版（GTK4）。ワークスペースの外なので別に回す
  linux-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/linux
      - name: Install GTK4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libudev-dev pkg-config
      - run: cargo fmt --manifest-path apps/linux/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/linux/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/linux/Cargo.toml
