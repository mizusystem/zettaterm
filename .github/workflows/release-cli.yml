name: Release zetta CLI

# zetta コマンド（TTL のヘッドレス実行）を Linux / Windows / macOS 向けにビルドして配る。
# - v で始まるタグを push すると、ビルドして GitHub Releases に置く（下書き。公開は手で行う）
# - 手動実行（workflow_dispatch）はビルドだけ（成果物は Actions の Artifacts に残る）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install libudev (Linux, for serialport)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - run: cargo build --release --locked -p zetta-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="zetta-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin="target/${{ matrix.target }}/release/zetta"
          [[ "${{ runner.os }}" == "Windows" ]] && bin="$bin.exe"
          cp "$bin" docs/ttl.md THIRD_PARTY.md "dist/$name/"
          cd dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "ASSET=dist/$name.${{ matrix.archive }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: zetta-${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
