[package]
name = "mt-ffi"
description = "UniFFI による公開 API と Swift バインディング生成"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "mt_ffi"
crate-type = ["lib", "staticlib"]

[[bin]]
# Swift バインディング生成器。apps/macos/scripts/build-core.sh から使う。
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
mt-core.workspace = true
mt-serial.workspace = true
mt-net.workspace = true
uniffi = "0.32.2"
mt-xfer.workspace = true
mt-ttl.workspace = true

[lints]
workspace = true
