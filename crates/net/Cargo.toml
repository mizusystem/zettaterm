[package]
name = "mt-net"
description = "SSH（russh、またはシステムの ssh を PTY 起動）、Telnet、生 TCP、ローカル PTY"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "mt_net"

[dependencies]
if-addrs = "0.15.0"
mt-core.workspace = true
portable-pty = "0.9.0"
rand = { version = "0.10", features = ["thread_rng"] }
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa", "flate2"] }
ssh2-config = "0.9.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "process"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
